name: Release

# Releases are NOT created on push to main — only when a semver-style tag is pushed,
# or when you run this workflow manually (Actions → Release → Run workflow).
on:
  push:
    tags:
      - 'v*.*.*'   # e.g. v0.1.0, v1.2.3 (needs three numeric parts)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to publish (same as git tag), e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: punch.exe
            asset_name: punch-windows-x86_64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: punch
            asset_name: punch-linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: punch
            asset_name: punch-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: punch
            asset_name: punch-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('core/Cargo.toml') }}

      - name: Build release binary
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp core/target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Punch ${{ steps.version.outputs.VERSION }}
          body: |
            ## 👊 Punch ${{ steps.version.outputs.VERSION }}

            Punches through networks to connect two devices directly.
            No VPN. No account. No cloud middleman.

            ## Download

            | Platform | File |
            |----------|------|
            | Windows (x64) | `punch-windows-x86_64.exe` |
            | Linux (x64) | `punch-linux-x86_64` |
            | macOS (Intel) | `punch-macos-x86_64` |
            | macOS (Apple Silicon) | `punch-macos-arm64` |

            ## Usage
            ```bash
            # Device A — generate a code
            punch generate --server wss://punch-8o2u.onrender.com

            # Device B — connect
            punch connect <code> --server wss://punch-8o2u.onrender.com
            ```

            ## What's new
            See [ROADMAP](https://github.com/MannanSaood/Punch/blob/main/docs/ROADMAP.md)

          files: artifacts/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
