name: Release

# Runs when:
# 1) You push a semver tag (v1.2.3), or
# 2) You push to main and the `version` line in core/Cargo.toml changed, or
# 3) You run the workflow manually (Actions → Release → Run workflow) and enter a tag.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to publish (same as git tag), e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      run_release: ${{ steps.plan.outputs.run_release }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to release
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VER="${REF#refs/tags/}"
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main: only release when Cargo.toml version changes
          if [ "$REF" = "refs/heads/main" ]; then
            CUR=$(grep -m1 '^version' core/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            PREV=$(git show HEAD~1:core/Cargo.toml 2>/dev/null | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/' || true)
            if [ -n "$CUR" ] && [ "$CUR" != "$PREV" ]; then
              echo "run_release=true" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "version=v${CUR}" >> "$GITHUB_OUTPUT"
            else
              echo "run_release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "run_release=false" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build ${{ matrix.target }}
    needs: release-plan
    if: needs.release-plan.outputs.run_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: punch.exe
            asset_name: punch-windows-x86_64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: punch
            asset_name: punch-linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: punch
            asset_name: punch-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: punch
            asset_name: punch-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-plan.outputs.checkout_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('core/Cargo.toml') }}

      - name: Build release binary
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp core/target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  create-release:
    name: Create GitHub Release
    needs: [release-plan, build-release]
    if: needs.release-plan.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-plan.outputs.checkout_ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plan.outputs.version }}
          name: Punch ${{ needs.release-plan.outputs.version }}
          body: |
            ## 👊 Punch ${{ needs.release-plan.outputs.version }}

            Punches through networks to connect two devices directly.
            No VPN. No account. No cloud middleman.

            ## Download

            | Platform | File |
            |----------|------|
            | Windows (x64) | `punch-windows-x86_64.exe` |
            | Linux (x64) | `punch-linux-x86_64` |
            | macOS (Intel) | `punch-macos-x86_64` |
            | macOS (Apple Silicon) | `punch-macos-arm64` |

            ## Usage
            ```bash
            # Device A — generate a code
            punch generate

            # Device B — connect (uses default ws://129.159.21.6:8080)
            punch connect <code>
            ```

            ## What's new
            See [ROADMAP](https://github.com/MannanSaood/Punch/blob/main/docs/ROADMAP.md)

          files: artifacts/*
          draft: false
          prerelease: ${{ contains(needs.release-plan.outputs.version, '-') }}
