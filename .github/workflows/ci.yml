name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cli:
    name: Build CLI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/punch-cli/Cargo.toml', 'core/punch-core/Cargo.toml') }}

      - name: Build
        working-directory: core
        run: cargo build --locked --release -p punch-cli

      - name: Check warnings
        working-directory: core
        run: cargo clippy -p punch-cli -- -D warnings

  build-server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build -o punch-server ./cmd/main.go

      - name: Vet
        working-directory: server
        run: go vet ./...