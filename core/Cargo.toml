[package]
name = "punch-cli"
version = "0.8.0"
edition = "2021"
authors = ["Syed Mannan Saood <syed.mannan@outlook.com>"]
description = "Punches through networks to connect two devices directly"
license = "MIT"
repository = "https://github.com/MannanSaood/punch"

[[bin]]
name = "punch"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client (for signalling server connection)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Encryption for relay traffic (ChaCha20-Poly1305)
chacha20poly1305 = "0.10"

# Error handling
anyhow = "1"

# Home directory resolution
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random number generation (for token codes)
rand = "0.8"

# UUID for session IDs
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Futures utilities
futures-util = "0.3"

# URL parsing
url = "2"

# X25519 Diffie-Hellman key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Random key generation
rand_core = { version = "0.6", features = ["getrandom"] }

# Local dashboard server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# File transfer
sha2 = "0.10"
indicatif = "0.17"
futures = "0.3"

# Iroh — p2p QUIC transport with built-in hole punching and relay
iroh = "0.96"

# Datagram payloads for Iroh UDP forward
bytes = "1"

# PTY for shell sessions (cross-platform — Windows ConPTY + Unix PTY)
portable-pty = "0.8"
 
# Terminal UI for Device B monitoring view
crossterm = "0.27"

# Dashboard
rust-embed = "8.0"
mime_guess = "2.0"